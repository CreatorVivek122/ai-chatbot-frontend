<div class="flex flex-col h-screen bg-gray-50">

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">

    <div *ngFor="let msg of messages" class="flex"
         [ngClass]="msg.sender === 'user' ? 'justify-end' : 'justify-start'">

      <div
        class="max-w-[75%] rounded-xl px-4 py-3 text-sm leading-relaxed whitespace-pre-wrap"
        [ngClass]="msg.sender === 'user'
          ? 'bg-black text-white rounded-br-none'
          : 'bg-gray-200 text-gray-900 rounded-bl-none'">

        <!-- USER MESSAGE -->
        <span *ngIf="msg.sender === 'user'">
          {{ msg.text }}
        </span>

        <!-- BOT MESSAGE (MARKDOWN) -->
        <markdown
          *ngIf="msg.sender === 'bot'"
          [data]="msg.text">
        </markdown>

      </div>
    </div>

    <!-- Typing indicator -->
    <div *ngIf="isLoading" class="flex justify-start">
      <div class="bg-gray-200 px-4 py-2 rounded-xl text-sm italic">
        Typing...
      </div>
    </div>

  </div>

  <!-- Input -->
  <div class="flex gap-2 p-4 border-t bg-white">

    <input
      type="text"
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      placeholder="Type your message..."
      class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black"
    />

    <button
      (click)="sendMessage()"
      [disabled]="isLoading"
      class="bg-black text-white px-5 py-2 rounded-lg disabled:opacity-50">
      Send
    </button>

  </div>
</div>
