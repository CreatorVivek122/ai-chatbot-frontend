<div class="flex h-screen bg-gray-50 overflow-hidden">

  <!-- ================= SIDEBAR ================= -->
  <aside class="w-64 border-r bg-white flex flex-col h-full overflow-hidden">

    <!-- New Chat Button -->
    <button (click)="createNewChat()" class="m-3 px-3 py-2 bg-black text-white rounded-lg">
      + New Chat
    </button>

    <!-- 🔽 Scrollable History -->
    <div class="flex-1 overflow-y-auto min-h-0">

      <!-- ⭐ STARRED -->
      <div *ngIf="starredChats.length" class="px-3 text-xs text-gray-500 mt-2">
        STARRED
      </div>

      <div *ngFor="let chat of starredChats" (click)="switchChat(chat.id)"
        class="group px-4 py-2 cursor-pointer hover:bg-gray-100 flex justify-between">

        <span class="truncate">⭐ {{ chat.title }}</span>

        <span class="opacity-0 group-hover:opacity-100 px-2 py-1 rounded hover:bg-gray-200"
          (click)="$event.stopPropagation(); toggleStar(chat)">
          ★
        </span>
      </div>

      <!-- 🕘 RECENT -->
      <div class="px-3 text-xs text-gray-500 mt-4">
        YOUR CHATS
      </div>

      <div *ngFor="let chat of recentChats" (click)="switchChat(chat.id)"
        class="group px-4 py-2 cursor-pointer hover:bg-gray-100 flex justify-between">

        <!-- Title / typing -->
        <div class="flex items-center gap-2 truncate">
          <span *ngIf="!chat.isGeneratingTitle">{{ chat.title }}</span>

          <span *ngIf="chat.isGeneratingTitle" class="flex gap-1">
            <span class="w-1 h-1 bg-gray-500 rounded-full animate-bounce"></span>
            <span class="w-1 h-1 bg-gray-500 rounded-full animate-bounce delay-150"></span>
            <span class="w-1 h-1 bg-gray-500 rounded-full animate-bounce delay-300"></span>
          </span>
        </div>

        <!-- Three dots -->
        <span class="opacity-0 group-hover:opacity-100 transition-opacity
                 px-2 py-1 rounded hover:bg-gray-200 cursor-pointer">
          ⋯
        </span>
      </div>

    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="flex flex-col flex-1 h-full overflow-hidden">

    <!-- NAVBAR -->
    <div class="h-14 border-b bg-white flex items-center justify-between px-4">

      <!-- Chat title + menu -->
      <div class="relative chat-menu flex items-center gap-2">
        <span *ngIf="!renamingChat" class="font-medium">
          {{ activeChat.title }}
        </span>

        <input *ngIf="renamingChat" [(ngModel)]="renameInput" (keyup.enter)="confirmRename()"
          class="border rounded px-2 py-1 text-sm" />

        <button (click)="toggleChatMenu()">▾</button>

        <!-- Dropdown -->
        <div *ngIf="isChatMenuOpen" class="absolute top-12 left-0 bg-white border rounded shadow w-40 z-50">

          <div class="group flex items-center gap-2 px-3 py-2 cursor-pointer
                   transition-all hover:bg-gray-100 hover:pl-4" (click)="startRename()">
            ✏️ Rename
          </div>

          <div class="group flex items-center gap-2 px-3 py-2 cursor-pointer
                   transition-all hover:bg-gray-100 hover:pl-4" (click)="toggleStar(activeChat)">
            ⭐ {{ activeChat.isStarred ? 'Unstar' : 'Star' }}
          </div>

          <div class="group flex items-center gap-2 px-3 py-2 cursor-pointer
                   transition-all hover:bg-red-50 hover:pl-4 text-red-600" (click)="deleteChat(activeChat)">
            🗑 Delete
          </div>
        </div>
      </div>

      <!-- Model Picker -->
      <div class="relative model-picker">
        <button (click)="toggleModelMenu()" class="px-3 py-1 border rounded">
          {{ selectedModel }} ▾
        </button>

        <div *ngIf="isModelMenuOpen" class="absolute right-0 mt-2 bg-white border rounded shadow">

          <div *ngFor="let m of models" (click)="selectModel(m.value)"
            class="px-4 py-2 hover:bg-gray-100 cursor-pointer">
            {{ m.label }}
          </div>
        </div>
      </div>
    </div>

    <!-- ================= CHAT BODY ================= -->
    <div *ngIf="!isFirstInteraction" class="flex flex-col flex-1 overflow-hidden min-h-0">

      <!-- Messages (SCROLLS) -->
      <div class="flex-1 overflow-y-auto min-h-0 p-4 space-y-4">

        <div *ngFor="let msg of activeChat.messages" class="flex" [ngClass]="msg.sender === 'user'
               ? 'justify-end'
               : 'justify-start'">

          <div class="max-w-[75%] rounded-xl px-4 py-3 text-sm whitespace-pre-wrap" [ngClass]="msg.sender === 'user'
              ? 'bg-black text-white rounded-br-none'
              : 'bg-gray-200 text-gray-900 rounded-bl-none'">

            <span *ngIf="msg.sender === 'user'">{{ msg.text }}</span>
            <markdown *ngIf="msg.sender === 'bot'" [data]="msg.text"></markdown>
          </div>
        </div>

        <div *ngIf="isLoading" class="italic text-sm text-gray-500">
          Typing...
        </div>
      </div>

      <!-- Input (FIXED) -->
      <div class="flex gap-2 p-4 border-t bg-white">
        <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Type your message..."
          class="flex-1 border rounded-lg px-3 py-2" />

        <button (click)="sendMessage()" class="bg-black text-white px-5 py-2 rounded-lg">
          Send
        </button>
      </div>
    </div>

    <!-- FIRST VISIT -->
    <!-- FIRST VISIT (OLD UI – FIXED) -->
    <div *ngIf="isFirstInteraction" class="flex flex-col items-center justify-center flex-1 min-h-0 text-center px-4">

      <h1 class="text-3xl font-semibold mb-3">
        Hello 👋 I’m Ang
      </h1>

      <p class="text-gray-600 mb-6 max-w-md">
        Ask me anything — coding, concepts, or ideas.
      </p>

      <div class="w-full max-w-xl flex gap-2">
        <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Type your message..."
          class="flex-1 border rounded-lg px-4 py-3
             focus:outline-none focus:ring-2 focus:ring-black" />

        <button (click)="sendMessage()" class="bg-black text-white px-5 py-3 rounded-lg">
          Send
        </button>
      </div>
    </div>

  </div>
</div>
