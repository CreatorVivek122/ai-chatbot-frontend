<div class="flex h-screen overflow-hidden" style="background-color: var(--bg-main); color: var(--text-main);">

  <!-- ================= SIDEBAR ================= -->
  <aside class="border-r flex flex-col transition-all duration-300" [class.w-64]="isSidebarOpen"
    [class.w-16]="!isSidebarOpen" style="background-color: var(--bg-panel); border-color: var(--border-color);">

    <!-- SIDEBAR HEADER -->
    <div class="h-14 flex items-center justify-between px-3">

      <!-- ANG branding -->
      <span *ngIf="isSidebarOpen" class="font-semibold text-lg" style="color: var(--text-main);">
        Ang
      </span>

      <!-- Toggle button -->
      <button (click)="toggleSidebar()" class="p-1 rounded hover:bg-[var(--bg-hover)]" title="Toggle sidebar">
        ☰
      </button>
    </div>



    <div *ngIf="isSidebarOpen" class="flex-1 overflow-y-auto">
      <button (click)="createNewChat()" class="m-3 px-3 py-2 rounded-lg text-white" style="background:#000">
        + New Chat
      </button>

      <!-- ⭐ STARRED -->
      <div *ngIf="starredChats.length" class="px-3 pt-3 pb-1 text-xs font-semibold" style="color: var(--text-muted);">
        STARRED
      </div>

      <div *ngFor="let chat of starredChats" (click)="switchChat(chat.id)"
        class="px-4 py-2 cursor-pointer flex items-center gap-2" style="color: var(--text-main);"
        onmouseover="this.style.backgroundColor='var(--bg-hover)'"
        onmouseout="this.style.backgroundColor='transparent'">

        <span>⭐</span>
        <span class="truncate">{{ chat.title }}</span>
      </div>

      <!-- RECENTS -->
      <div *ngIf="recentChats.length" class="px-3 pt-4 pb-1 text-xs font-semibold" style="color: var(--text-muted);">
        RECENTS
      </div>

      <div *ngFor="let chat of recentChats" (click)="switchChat(chat.id)" class="px-4 py-2 cursor-pointer truncate"
        style="color: var(--text-main);" onmouseover="this.style.backgroundColor='var(--bg-hover)'"
        onmouseout="this.style.backgroundColor='transparent'">
        {{ chat.title }}
      </div>

    </div>
  </aside>


  <!-- ================= MAIN ================= -->
  <div class="flex flex-col flex-1">

    <!-- ================= NAVBAR ================= -->
    <div class="h-14 border-b flex items-center justify-between px-4"
      style="background-color: var(--bg-panel); border-color: var(--border-color);">

      <!-- LEFT: TITLE + CHAT MENU -->
      <div class="relative chat-menu flex items-center gap-2">

        <span *ngIf="!renamingChat" class="font-medium">
          {{ activeChat.title }}
        </span>

        <input *ngIf="renamingChat" [(ngModel)]="renameInput" (keyup.enter)="confirmRename()"
          class="border rounded px-2 py-1 text-sm"
          style="background-color: var(--bg-input); color: var(--text-main); border-color: var(--border-color);" />

        <button (click)="toggleChatMenu()">▾</button>

        <!-- CHAT DROPDOWN -->
        <div *ngIf="isChatMenuOpen" class="absolute top-10 left-0 w-40 border rounded shadow z-50"
          style="background-color: var(--bg-panel); border-color: var(--border-color);">

          <div class="px-3 py-2 cursor-pointer" onmouseover="this.style.backgroundColor='var(--bg-hover)'"
            onmouseout="this.style.backgroundColor='transparent'" (click)="startRename()">
            ✏️ Rename
          </div>

          <div class="px-3 py-2 cursor-pointer" onmouseover="this.style.backgroundColor='var(--bg-hover)'"
            onmouseout="this.style.backgroundColor='transparent'" (click)="toggleStar(activeChat)">
            ⭐ {{ activeChat.isStarred ? 'Unstar' : 'Star' }}
          </div>

          <div class="px-3 py-2 cursor-pointer" style="color:#dc2626" onmouseover="this.style.backgroundColor='#fee2e2'"
            onmouseout="this.style.backgroundColor='transparent'" (click)="deleteChat(activeChat)">
            🗑 Delete
          </div>
        </div>
      </div>

      <!-- RIGHT: THEME + MODEL -->
      <div class="flex gap-3 items-center">

        <button (click)="toggleTheme()" class="px-3 py-1 border rounded"
          style="background-color: var(--bg-hover); border-color: var(--border-color);">
          {{ isDarkMode ? 'Dark' : 'Light' }}
        </button>

        <div class="relative model-picker">
          <button (click)="toggleModelMenu()" class="px-3 py-1 border rounded"
            style="background-color: var(--bg-input); border-color: var(--border-color);">
            {{ selectedModel }} ▾
          </button>

          <div *ngIf="isModelMenuOpen" class="absolute right-0 mt-2 border rounded shadow z-50"
            style="background-color: var(--bg-panel); border-color: var(--border-color);">

            <div *ngFor="let m of models" (click)="selectModel(m.value)" class="px-4 py-2 cursor-pointer"
              onmouseover="this.style.backgroundColor='var(--bg-hover)'"
              onmouseout="this.style.backgroundColor='transparent'">
              {{ m.label }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= FIRST VISIT ================= -->
    <div *ngIf="isFirstInteraction" class="flex flex-col items-center justify-center flex-1 text-center px-4">

      <h1 class="text-3xl font-semibold mb-3">Hello 👋 I’m Ang</h1>

      <p class="mb-6 max-w-md" style="color: var(--text-muted);">
        Ask me anything — coding, concepts, or ideas.
      </p>

      <div class="w-full max-w-xl flex gap-2">
        <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Type your message..."
          class="flex-1 border rounded-lg px-4 py-3"
          style="background-color: var(--bg-input); color: var(--text-main); border-color: var(--border-color);" />

        <button (click)="sendMessage()" class="px-5 py-3 rounded-lg text-white" style="background:#000">
          Send
        </button>
      </div>
    </div>

    <!-- ================= CHAT ================= -->
    <div *ngIf="!isFirstInteraction" class="flex flex-col flex-1">

      <div class="flex-1 overflow-y-auto p-4 space-y-4">

        <div *ngFor="let msg of activeChat.messages" class="flex"
          [ngClass]="msg.sender === 'user' ? 'justify-end' : 'justify-start'">

          <div class="max-w-[75%] rounded-xl px-4 py-3 text-sm" [ngStyle]="{
                 backgroundColor: msg.sender === 'user' ? '#000' : 'var(--bg-hover)',
                 color: msg.sender === 'user' ? '#fff' : 'var(--text-main)'
               }">

            <span *ngIf="msg.sender === 'user'">{{ msg.text }}</span>
            <markdown *ngIf="msg.sender === 'bot'" [data]="msg.text"></markdown>
          </div>
        </div>

        <div *ngIf="isLoading" class="italic text-sm" style="color: var(--text-muted);">
          Typing...
        </div>
      </div>

      <!-- INPUT -->
      <div class="flex gap-2 p-4 border-t"
        style="background-color: var(--bg-panel); border-color: var(--border-color);">

        <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Type your message..."
          class="flex-1 border rounded-lg px-3 py-2"
          style="background-color: var(--bg-input); color: var(--text-main); border-color: var(--border-color);" />

        <button (click)="sendMessage()" class="px-5 py-2 rounded-lg text-white" style="background:#000">
          Send
        </button>
      </div>
    </div>

  </div>
</div>
