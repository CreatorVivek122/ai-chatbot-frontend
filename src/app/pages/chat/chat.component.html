<div class="flex flex-col h-screen bg-gray-50">

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">

    <div *ngFor="let msg of messages"
         class="flex"
         [ngClass]="msg.sender === 'user' ? 'justify-end' : 'justify-start'">

      <div
        class="max-w-[75%] rounded-xl px-4 py-3 text-sm leading-relaxed whitespace-pre-wrap"
        [ngClass]="msg.sender === 'user'
          ? 'bg-black text-white rounded-br-none'
          : 'bg-gray-200 text-gray-900 rounded-bl-none'">

        <span *ngIf="msg.sender === 'user'">
          {{ msg.text }}
        </span>

        <markdown *ngIf="msg.sender === 'bot'" [data]="msg.text"></markdown>
      </div>
    </div>

    <div *ngIf="isLoading" class="flex justify-start">
      <div class="bg-gray-200 px-4 py-2 rounded-xl text-sm italic">
        Typing...
      </div>
    </div>

  </div>

  <!-- Input Bar -->
  <div class="flex items-center gap-2 p-4 border-t bg-white">

    <!-- 🔽 Model Picker -->
    <div class="relative model-picker">
      <button
        (click)="toggleModelMenu()"
        class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg
               bg-gray-100 hover:bg-gray-200 border">

        {{ selectedModelLabel }}
        <span class="text-xs">▾</span>
      </button>

      <!-- Dropdown -->
      <div
        *ngIf="isModelMenuOpen"
        class="absolute bottom-12 left-0 w-64 bg-white border rounded-xl
               shadow-xl z-50">

        <div
          *ngFor="let m of models"
          (click)="selectModel(m.value)"
          class="px-4 py-3 cursor-pointer hover:bg-gray-100">

          <div class="flex justify-between items-center">
            <div class="font-medium text-sm">
              {{ m.title }}
            </div>
            <span *ngIf="m.value === selectedModel">✔</span>
          </div>

          <div class="text-xs text-gray-500">
            {{ m.description }}
          </div>
        </div>

      </div>
    </div>

    <!-- Text Input -->
    <input
      type="text"
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      placeholder="Type your message..."
      class="flex-1 border rounded-lg px-3 py-2
             focus:outline-none focus:ring-2 focus:ring-black"
    />

    <button
      (click)="sendMessage()"
      [disabled]="isLoading"
      class="bg-black text-white px-5 py-2 rounded-lg disabled:opacity-50">
      Send
    </button>

  </div>
</div>
