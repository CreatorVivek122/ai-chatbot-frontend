<div class="flex h-screen bg-gray-50">

  <!-- SIDEBAR -->
  <aside class="w-64 border-r bg-white flex flex-col">
    <button
      (click)="createNewChat()"
      class="m-3 px-3 py-2 bg-black text-white rounded-lg">
      + New Chat
    </button>

    <div class="flex-1 overflow-y-auto">
      <div
        *ngFor="let chat of chats"
        (click)="switchChat(chat.id)"
        class="px-4 py-3 cursor-pointer text-sm"
        [ngClass]="chat.id === activeChatId
          ? 'bg-gray-200 font-medium'
          : 'hover:bg-gray-100'">

        <div class="flex items-center gap-2 truncate">

          <!-- 🧠 Show title ONLY when not generating -->
          <span *ngIf="!chat.isGeneratingTitle">
            {{ chat.title }}
          </span>
        
          <!-- 🔄 Show animation ONLY while generating -->
          <span *ngIf="chat.isGeneratingTitle" class="flex gap-1">
            <span class="w-1 h-1 bg-gray-500 rounded-full animate-bounce"></span>
            <span class="w-1 h-1 bg-gray-500 rounded-full animate-bounce delay-150"></span>
            <span class="w-1 h-1 bg-gray-500 rounded-full animate-bounce delay-300"></span>
          </span>
        
        </div>


        <div class="text-xs text-gray-500 ">
          {{ chat.model }}
        </div>
      </div>
    </div>
  </aside>

  <!-- CHAT AREA -->
  <div class="flex flex-col flex-1">

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">

      <div *ngFor="let msg of activeChat.messages"
           class="flex"
           [ngClass]="msg.sender === 'user' ? 'justify-end' : 'justify-start'">

        <div
          class="max-w-[75%] rounded-xl px-4 py-3 text-sm whitespace-pre-wrap"
          [ngClass]="msg.sender === 'user'
            ? 'bg-black text-white rounded-br-none'
            : 'bg-gray-200 text-gray-900 rounded-bl-none'">

          <span *ngIf="msg.sender === 'user'">
            {{ msg.text }}
          </span>

          <markdown *ngIf="msg.sender === 'bot'" [data]="msg.text"></markdown>
        </div>
      </div>

      <div *ngIf="isLoading" class="italic text-sm text-gray-500">
        Typing...
      </div>

    </div>

    <!-- INPUT BAR -->
    <div class="flex items-center gap-2 p-4 border-t bg-white">

      <!-- MODEL PICKER -->
      <div class="relative model-picker">
        <button
          (click)="toggleModelMenu()"
          class="px-3 py-2 text-sm bg-gray-100 border rounded-lg">
          {{ selectedModelLabel }} ▾
        </button>

        <div
          *ngIf="isModelMenuOpen"
          class="absolute bottom-12 left-0 w-48 bg-white border rounded-xl shadow-lg">

          <div
            *ngFor="let m of models"
            (click)="selectModel(m.value)"
            class="px-4 py-3 hover:bg-gray-100 cursor-pointer">
            {{ m.label }}
          </div>

        </div>
      </div>

      <input
        type="text"
        [(ngModel)]="userInput"
        (keyup.enter)="sendMessage()"
        placeholder="Type your message..."
        class="flex-1 border rounded-lg px-3 py-2"
      />

      <button
        (click)="sendMessage()"
        [disabled]="isLoading"
        class="bg-black text-white px-5 py-2 rounded-lg">
        Send
      </button>

    </div>
  </div>
</div>
