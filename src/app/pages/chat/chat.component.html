<div class="flex h-screen bg-gray-50">
  <!-- SIDEBAR -->
  <aside class="w-64 border-r bg-white flex flex-col">
    <button
      (click)="createNewChat()"
      class="m-3 px-3 py-2 bg-black text-white rounded-lg"
    >
      + New Chat
    </button>

    <!-- ⭐ STARRED -->
    <div *ngIf="starredChats.length" class="px-3 text-xs text-gray-500 mt-2">
      STARRED
    </div>

    <div
      *ngFor="let chat of starredChats"
      (click)="switchChat(chat.id)"
      class="group px-4 py-2 cursor-pointer hover:bg-gray-100 flex justify-between"
    >
      <span class="truncate">⭐ {{ chat.title }}</span>
      <span
        class="opacity-0 group-hover:opacity-100"
        (click)="$event.stopPropagation(); toggleStar(chat)"
      >
        ★
      </span>
    </div>

    <!-- RECENT -->
    <div class="px-3 text-xs text-gray-500 mt-4">YOUR CHATS</div>

    <div
      *ngFor="let chat of recentChats"
      (click)="switchChat(chat.id)"
      class="group px-4 py-2 cursor-pointer hover:bg-gray-100 flex justify-between"
    >
      <!-- title / typing -->
      <div class="flex items-center gap-2 truncate">
        <span *ngIf="!chat.isGeneratingTitle">{{ chat.title }}</span>
        <span *ngIf="chat.isGeneratingTitle" class="flex gap-1">
          <span class="w-1 h-1 bg-gray-500 rounded-full animate-bounce"></span>
          <span
            class="w-1 h-1 bg-gray-500 rounded-full animate-bounce delay-150"
          ></span>
          <span
            class="w-1 h-1 bg-gray-500 rounded-full animate-bounce delay-300"
          ></span>
        </span>
      </div>

      <!-- three dots -->
      <span
        class="opacity-0 group-hover:opacity-100 transition-opacity duration-150 px-2 py-1 rounded hover:bg-gray-200 cursor-pointer"
      >
        ⋯
      </span>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="flex flex-col flex-1">
    <!-- NAVBAR -->
    <div class="h-14 border-b bg-white flex items-center justify-between px-4">
      <div class="relative chat-menu flex items-center gap-2">
        <span *ngIf="!renamingChat" class="font-medium">
          {{ activeChat.title }}
        </span>

        <input
          *ngIf="renamingChat"
          [(ngModel)]="renameInput"
          (keyup.enter)="confirmRename()"
          class="border rounded px-2 py-1 text-sm"
        />

        <button (click)="toggleChatMenu()">▾</button>

        <!-- Dropdown -->
        <div
          *ngIf="isChatMenuOpen"
          class="absolute top-12 left-0 bg-white border rounded shadow w-40 z-50"
        >
          <div
            class="group flex items-center gap-2 px-3 py-2 cursor-pointer transition-all duration-150 hover:bg-gray-100 hover:pl-4"
            (click)="startRename()"
          >
            <span class="transition-colors group-hover:text-black">✏️</span>
            <span>Rename</span>
          </div>

          <div
            class="group flex items-center gap-2 px-3 py-2 cursor-pointer transition-all duration-150 hover:bg-gray-100 hover:pl-4"
            (click)="toggleStar(activeChat)"
          >
            <span class="transition-colors group-hover:text-yellow-500"
              >⭐</span
            >
            <span>
              {{ activeChat.isStarred ? "Unstar" : "Star" }}
            </span>
          </div>

          <div
            class="group flex items-center gap-2 px-3 py-2 cursor-pointer transition-all duration-150 hover:bg-red-50 hover:pl-4"
            (click)="deleteChat(activeChat)"
          >
            <span class="transition-colors group-hover:text-red-600">🗑</span>
            <span class="text-red-600">Delete</span>
          </div>
        </div>
      </div>

      <!-- Model Picker -->
      <div class="relative model-picker">
        <button (click)="toggleModelMenu()" class="px-3 py-1 border rounded">
          {{ selectedModel }} ▾
        </button>

        <div
          *ngIf="isModelMenuOpen"
          class="absolute right-0 mt-2 bg-white border rounded shadow"
        >
          <div
            *ngFor="let m of models"
            (click)="selectModel(m.value)"
            class="group px-4 py-2 cursor-pointer transition-all duration-150 hover:bg-gray-100 hover:pl-5"
          >
            {{ m.label }}
          </div>
        </div>
      </div>
    </div>

    <!-- FIRST VISIT -->
    <div
      *ngIf="isFirstInteraction"
      class="flex flex-col items-center justify-center flex-1 text-center px-4"
    >
      <h1 class="text-3xl font-semibold mb-3">Hello 👋 I’m Ang</h1>
      <p class="text-gray-600 mb-6 max-w-md">
        Ask me anything — coding, concepts, or ideas.
      </p>

      <div class="w-full max-w-xl flex gap-2">
        <input
          type="text"
          [(ngModel)]="userInput"
          (keyup.enter)="sendMessage()"
          placeholder="Type your message..."
          class="flex-1 border rounded-lg px-4 py-3"
        />
        <button
          (click)="sendMessage()"
          class="bg-black text-white px-5 py-3 rounded-lg"
        >
          Send
        </button>
      </div>
    </div>

    <!-- CHAT -->
    <div *ngIf="!isFirstInteraction" class="flex flex-col flex-1">
      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <div
          *ngFor="let msg of activeChat.messages"
          class="flex"
          [ngClass]="msg.sender === 'user' ? 'justify-end' : 'justify-start'"
        >
          <div
            class="max-w-[75%] rounded-xl px-4 py-3 text-sm whitespace-pre-wrap"
            [ngClass]="
              msg.sender === 'user'
                ? 'bg-black text-white rounded-br-none'
                : 'bg-gray-200 text-gray-900 rounded-bl-none'
            "
          >
            <span *ngIf="msg.sender === 'user'">{{ msg.text }}</span>
            <markdown *ngIf="msg.sender === 'bot'" [data]="msg.text"></markdown>
          </div>
        </div>

        <div *ngIf="isLoading" class="italic text-sm text-gray-500">
          Typing...
        </div>
      </div>

      <!-- INPUT -->
      <div class="flex gap-2 p-4 border-t bg-white">
        <input
          type="text"
          [(ngModel)]="userInput"
          (keyup.enter)="sendMessage()"
          placeholder="Type your message..."
          class="flex-1 border rounded-lg px-3 py-2"
        />
        <button
          (click)="sendMessage()"
          class="bg-black text-white px-5 py-2 rounded-lg"
        >
          Send
        </button>
      </div>
    </div>
  </div>
</div>
